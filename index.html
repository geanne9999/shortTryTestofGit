 <!doctype html>

<html lang="en">

<head>

<meta charset="utf-8" />

<meta name="viewport" content="width=device-width,initial-scale=1" />

<title>Interactive Mesh Gradient Wallpaper</title>

<style>

  /* Page / Canvas reset */

  html,body {

    height:100%;

    margin:0;

    background:#0a0b10;

    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;

    -webkit-font-smoothing:antialiased;

    -moz-osx-font-smoothing:grayscale;

    overflow:hidden;

    color: #111217;

  }



  #app {

    position:fixed;

    inset:0;

    background:#0a0b10;

  }



  canvas#bg {

    position: absolute;

    inset:0;

    width:100%;

    height:100%;

    display:block;

    z-index:0;

    filter: blur(65px);

    transform: scale(1.2);

    transform-origin: center;

    will-change: transform, filter;

    background: transparent;

  }



  /* Glassmorphism control panel */

  .panel {

    position: absolute;

    right: 24px;

    top: 24px;

    width: 320px;

    padding: 14px;

    border-radius: 14px;

    background: rgba(15, 15, 25, 0.75);

    border: 1px solid rgba(255, 255, 255, 0.12);

    box-shadow: 0 8px 30px rgba(0,0,0,0.45);

    backdrop-filter: blur(8px) saturate(120%);

    -webkit-backdrop-filter: blur(8px) saturate(120%);

    color: #ffffff;

    z-index: 10;

    transition: transform 220ms ease, opacity 220ms ease;

    user-select:none;

  }



  .panel.hidden {

    transform: translateY(-12px);

    opacity: 0;

    pointer-events: none;

  }



  .panel header {

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin-bottom:8px;

  }



  .panel h1 {

    font-size:14px;

    font-weight:600;

    margin:0;

    letter-spacing:0.2px;

  }



  .panel .sub {

    font-size:11px;

    opacity:0.78;

    margin-top:4px;

    color: #c6d0e8;

  }



  .control-group {

    display:grid;

    grid-template-columns: 1fr auto;

    gap:10px;

    align-items:center;

    margin: 10px 0;

  }



  .color-row {

    display:flex;

    gap:8px;

    align-items:center;

  }



  .color-input {

    -webkit-appearance:none;

    appearance:none;

    border: none;

    width: 48px;

    height: 36px;

    border-radius:8px;

    cursor:pointer;

    padding:0;

    background:transparent;

    outline: none;

    box-shadow: 0 0 0 1px rgba(255,255,255,0.04) inset;

  }

  .color-input::-webkit-color-swatch-wrapper { padding:0; border-radius:8px; }

  .color-input::-webkit-color-swatch { border:none; border-radius:8px; }

  .color-input::-moz-color-swatch { border:none; border-radius:8px; }



  .color-meta {

    display:flex;

    gap:8px;

    align-items:center;

    font-size:12px;

  }



  .small-btn {

    appearance:none;

    background: rgba(255,255,255,0.04);

    border: 1px solid rgba(255,255,255,0.06);

    padding:6px 8px;

    font-size:12px;

    color:inherit;

    border-radius:8px;

    cursor:pointer;

  }



  .toggle {

    display:flex;

    align-items:center;

    gap:8px;

    font-size:12px;

    opacity:0.95;

  }



  .toggle input[type="checkbox"] {

    width:18px;

    height:18px;

    accent-color: #61dafb;

  }



  .footer {

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:8px;

    margin-top:8px;

  }



  .hint {

    font-size:12px;

    opacity:0.75;

  }



  /* Hide small input outline on focus for aesthetics */

  input:focus {

    outline: 2px solid rgba(255,255,255,0.06);

    border-radius:8px;

  }



  /* Responsive: move to left on small widths */

  @media (max-width:420px) {

    .panel {

      right:12px;

      left:12px;

      width:auto;

    }

  }



  /* tiny control for hide button */

  .hide-btn {

    display:inline-flex;

    gap:8px;

    align-items:center;

    padding:8px 10px;

    border-radius:10px;

    border:1px solid rgba(255,255,255,0.06);

    background: rgba(255,255,255,0.03);

    cursor:pointer;

    color:#e7f1ff;

    font-size:13px;

  }



  /* subtle focus ring for accessibility */

  .hide-btn:focus, .small-btn:focus {

    box-shadow: 0 0 0 4px rgba(97,218,251,0.12);

  }

</style>

</head>

<body>

<div id="app">

  <canvas id="bg" aria-hidden="true"></canvas>



  <div class="panel" id="panel" role="region" aria-label="Gradient controls">

    <header>

      <div>

        <h1>Mesh Gradient Controls</h1>

        <div class="sub">Floating color nodes — move your mouse to animate</div>

      </div>

      <div>

        <button class="hide-btn" id="toggleUiBtn" title="Hide UI (H / Esc)">Hide UI</button>

      </div>

    </header>



    <div id="pickers">

      <!-- color pickers inserted by JS for clarity and easier binding -->

    </div>



    <div class="footer">

      <div class="hint">Press H or Esc to toggle UI</div>

      <div>

        <button id="resetBtn" class="small-btn" title="Reset to defaults">Reset</button>

      </div>

    </div>

  </div>

</div>



<script>

/*

  Interactive Mesh Gradient

  - Canvas-based radial nodes that blend with 'lighter' compositing.

  - Control UI (glassmorphism) with 4 color pickers and enable toggles.

  - Minimum 2 active colors enforced: if user disables down to 1, an auto complementary color is generated.

  - Hide/Show UI (button + H key + Escape).

  - Smooth mouse follow with requestAnimationFrame.

*/



/* ---------- Configuration & Defaults ---------- */

const DEFAULT_COLORS = [

  '#00E5FF', // Cyan

  '#FFEB3B', // Vivid Yellow

  '#FF3D00', // Bright Orange-Red

  '#D500F9'  // Deep Magenta

];



const NODE_COUNT = 10;        // number of radial nodes

const MIN_ACTIVE_COLORS = 2;  // minimum colors to blend



/* ---------- DOM Elements ---------- */

const canvas = document.getElementById('bg');

const ctx = canvas.getContext('2d', { alpha: true });

const panel = document.getElementById('panel');

const pickersContainer = document.getElementById('pickers');

const toggleUiBtn = document.getElementById('toggleUiBtn');

const resetBtn = document.getElementById('resetBtn');



/* ---------- Responsive Canvas Setup ---------- */

let DPR = Math.max(1, window.devicePixelRatio || 1);

function resizeCanvas() {

  DPR = Math.max(1, window.devicePixelRatio || 1);

  canvas.width = Math.floor(canvas.clientWidth * DPR);

  canvas.height = Math.floor(canvas.clientHeight * DPR);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); // draw in CSS pixels

}

window.addEventListener('resize', resizeCanvas, { passive: true });



/* ---------- Mouse / Pointer State ---------- */

const mouse = { x: null, y: null, px: null, py: null, active: false, vx: 0, vy: 0, speed: 0, lastMoveAt: 0 };

window.addEventListener('pointermove', (e) => {

  const now = performance.now();

  const dt = Math.max(8, now - (mouse.lastMoveAt || now));

  const nextVx = mouse.x == null ? 0 : (e.clientX - mouse.x) / dt;

  const nextVy = mouse.y == null ? 0 : (e.clientY - mouse.y) / dt;



  mouse.x = e.clientX;

  mouse.y = e.clientY;

  mouse.active = true;

  mouse.vx = lerp(mouse.vx, nextVx, 0.45);

  mouse.vy = lerp(mouse.vy, nextVy, 0.45);

  mouse.speed = Math.hypot(mouse.vx, mouse.vy) * 1000;

  mouse.lastMoveAt = now;

});

window.addEventListener('pointerdown', () => mouse.active = true);

window.addEventListener('pointerup', () => {/* keep active for motion */});



/* ---------- Utility Functions ---------- */

function lerp(a, b, t) { return a + (b - a) * t; }

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }



/* Convert hex to rgba string with given alpha */

function hexToRgba(hex, alpha=1) {

  const h = hex.replace('#','');

  const bigint = parseInt(h.length === 3 ? h.split('').map(c => c+c).join('') : h, 16);

  const r = (bigint >> 16) & 255;

  const g = (bigint >> 8) & 255;

  const b = bigint & 255;

  return `rgba(${r},${g},${b},${alpha})`;

}



/* Hue rotate helper: convert hex->hsl->rotate->hex */

function hexToHsl(hex) {

  const h = hex.replace('#','');

  const bigint = parseInt(h.length === 3 ? h.split('').map(c => c+c).join('') : h, 16);

  let r = ((bigint >> 16) & 255) / 255;

  let g = ((bigint >> 8) & 255) / 255;

  let b = (bigint & 255) / 255;

  const max = Math.max(r,g,b), min = Math.min(r,g,b);

  let hdeg=0, s=0, l=(max+min)/2;

  if (max !== min) {

    const d = max - min;

    s = l > 0.5 ? d/(2-max-min) : d/(max+min);

    switch(max){

      case r: hdeg = (g - b) / d + (g < b ? 6 : 0); break;

      case g: hdeg = (b - r) / d + 2; break;

      case b: hdeg = (r - g) / d + 4; break;

    }

    hdeg *= 60;

  }

  return { h: hdeg, s, l };

}

function hslToHex(h,s,l){

  // h in degrees 0..360, s,l in 0..1

  h = (h % 360 + 360) % 360;

  const C = (1 - Math.abs(2*l-1)) * s;

  const X = C * (1 - Math.abs(((h/60) % 2) - 1));

  const m = l - C/2;

  let r=0,g=0,b=0;

  if (h < 60) { r=C; g=X; b=0; }

  else if (h < 120) { r=X; g=C; b=0; }

  else if (h < 180) { r=0; g=C; b=X; }

  else if (h < 240) { r=0; g=X; b=C; }

  else if (h < 300) { r=X; g=0; b=C; }

  else { r=C; g=0; b=X; }

  r = Math.round((r + m) * 255);

  g = Math.round((g + m) * 255);

  b = Math.round((b + m) * 255);

  const hex = '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');

  return hex;

}

function complementaryHex(hex) {

  const hsl = hexToHsl(hex);

  const newH = (hsl.h + 180) % 360;

  return hslToHex(newH, hsl.s, hsl.l);

}



/* ---------- Control Panel: create pickers dynamically ---------- */

const pickers = []; // { inputEl, enableEl, index }

function createControls() {

  pickersContainer.innerHTML = '';

  for (let i=0;i<4;i++){

    const wrapper = document.createElement('div');

    wrapper.className = 'control-group';

    wrapper.dataset.index = i;



    const colorRow = document.createElement('div');

    colorRow.className = 'color-row';



    const input = document.createElement('input');

    input.type = 'color';

    input.className = 'color-input';

    input.value = DEFAULT_COLORS[i] || '#ffffff';

    input.title = `Color ${i+1}`;

    input.setAttribute('aria-label', `Color ${i+1}`);



    const meta = document.createElement('div');

    meta.className = 'color-meta';



    const enableLabel = document.createElement('label');

    enableLabel.className = 'toggle';

    enableLabel.title = 'Enable / disable this color';



    const enable = document.createElement('input');

    enable.type = 'checkbox';

    enable.checked = true;

    enable.setAttribute('aria-checked','true');



    const text = document.createElement('span');

    text.textContent = `Color ${i+1}`;



    const clearBtn = document.createElement('button');

    clearBtn.type = 'button';

    clearBtn.className = 'small-btn';

    clearBtn.textContent = 'Disable';

    clearBtn.title = 'Disable this color';



    enableLabel.appendChild(enable);

    enableLabel.appendChild(text);



    meta.appendChild(enableLabel);

    meta.appendChild(clearBtn);



    colorRow.appendChild(input);

    colorRow.appendChild(meta);



    wrapper.appendChild(colorRow);

    pickersContainer.appendChild(wrapper);



    // store references

    pickers.push({ inputEl: input, enableEl: enable, clearBtn, wrapper });



    // events

    input.addEventListener('input', () => onColorsChanged());

    enable.addEventListener('change', () => {

      enable.setAttribute('aria-checked', enable.checked.toString());

      clearBtn.textContent = enable.checked ? 'Disable' : 'Enable';

      onColorsChanged();

    });

    clearBtn.addEventListener('click', () => {

      enable.checked = !enable.checked;

      enable.setAttribute('aria-checked', enable.checked.toString());

      clearBtn.textContent = enable.checked ? 'Disable' : 'Enable';

      onColorsChanged();

    });

  }

}

createControls();



/* ---------- Color management ---------- */

function getActiveColors() {

  const active = [];

  for (const p of pickers) {

    if (p.enableEl.checked) active.push(p.inputEl.value);

  }

  // If none active, fallback to defaults

  if (active.length === 0) {

    return DEFAULT_COLORS.slice(0, MIN_ACTIVE_COLORS);

  }

  // If only one active, generate complementary to ensure at least 2

  if (active.length === 1) {

    const comp = complementaryHex(active[0]);

    return [active[0], comp];

  }

  return active;

}



function onColorsChanged() {

  // assign node colors and update UI state if necessary

  const active = getActiveColors();

  assignColorsToNodes(active);

}



/* ---------- Node system ---------- */

let nodes = [];

function createNodes() {

  nodes = [];

  const w = canvas.clientWidth;

  const h = canvas.clientHeight;

  const diag = Math.hypot(w, h);

  const activeColors = getActiveColors();



  for (let i = 0; i < NODE_COUNT; i++) {

    // broad coverage + lava-lamp style motion

    const baseX = w * 0.5;

    const baseY = h * 0.5;

    const radius = lerp(Math.min(w,h) * 0.45, Math.min(w,h) * 0.80, Math.random());

    const floatSpeed = lerp(0.20, 0.80, Math.random());

    const parallax = lerp(0.02, 0.22, Math.random()); // how strongly it follows mouse

    const wobble = Math.random() * Math.PI * 2;

    const color = activeColors[i % activeColors.length];



    // Sweeping figure-8 / Lissajous orbits

    const pathAmpX = lerp(w * 0.18, w * 0.42, Math.random());

    const pathAmpY = lerp(h * 0.16, h * 0.40, Math.random());

    const pathFreqX = lerp(0.08, 0.19, Math.random());

    const pathFreqY = lerp(0.11, 0.23, Math.random());

    const pathPhaseX = Math.random() * Math.PI * 2;

    const pathPhaseY = Math.random() * Math.PI * 2;



    // Harmonic local liquid offsets

    const hAmp1 = lerp(diag * 0.010, diag * 0.040, Math.random());

    const hAmp2 = lerp(diag * 0.012, diag * 0.034, Math.random());

    const hAmp3 = lerp(diag * 0.008, diag * 0.028, Math.random());

    const hFreq1 = lerp(0.45, 0.95, Math.random());

    const hFreq2 = lerp(0.24, 0.68, Math.random());

    const hFreq3 = lerp(0.12, 0.40, Math.random());

    const hPhase1 = Math.random() * Math.PI * 2;

    const hPhase2 = Math.random() * Math.PI * 2;

    const hPhase3 = Math.random() * Math.PI * 2;



    // Asynchronous pulsing

    const pulseSpeed = lerp(0.45, 1.25, Math.random());

    const pulsePhase = Math.random() * Math.PI * 2;



    nodes.push({

      baseX, baseY,

      x: baseX, y: baseY,

      baseRadius: radius,

      renderRadius: radius,

      floatSpeed, parallax, wobble,

      color,

      pathAmpX, pathAmpY, pathFreqX, pathFreqY, pathPhaseX, pathPhaseY,

      hAmp1, hAmp2, hAmp3, hFreq1, hFreq2, hFreq3, hPhase1, hPhase2, hPhase3,

      pulseSpeed, pulsePhase

    });

  }

}

/* createNodes() will be called after the canvas is sized */



/* Reassign node colors when active set changes */

function assignColorsToNodes(activeColors) {

  if (!activeColors || activeColors.length < 1) return;

  for (let i=0;i<nodes.length;i++){

    nodes[i].color = activeColors[i % activeColors.length];

  }

}



/* ---------- Animation Loop ---------- */

let rafId = null;

let lastTime = 0;



function animate(time = 0) {

  const dt = Math.min(32, time - lastTime); // ms

  lastTime = time;



  // clear frame so additive blending starts from a clean slate

  ctx.clearRect(0, 0, canvas.width / DPR, canvas.height / DPR);



  // set additive blending for vibrant mixing

  ctx.globalCompositeOperation = 'lighter';

  ctx.globalAlpha = 1.0;



  const w = canvas.clientWidth;

  const h = canvas.clientHeight;

  const cx = w / 2;

  const cy = h / 2;



  // mouse smoothing and default center drift

  if (mouse.x === null || mouse.y === null) {

    mouse.px = lerp(mouse.px ?? cx, cx, 0.02);

    mouse.py = lerp(mouse.py ?? cy, cy, 0.02);

  } else {

    if (mouse.px == null) { mouse.px = mouse.x; mouse.py = mouse.y; }

    mouse.px = lerp(mouse.px, mouse.x, 0.12);

    mouse.py = lerp(mouse.py, mouse.y, 0.12);

  }

  mouse.vx = lerp(mouse.vx, 0, 0.03);

  mouse.vy = lerp(mouse.vy, 0, 0.03);

  mouse.speed = Math.hypot(mouse.vx, mouse.vy) * 1000;



  // draw nodes with multi-frequency fluid motion + magnetic mouse warp

  for (let i = 0; i < nodes.length; i++) {

    const n = nodes[i];

    const timeSec = time * 0.001;



    // Lissajous / figure-8 drift

    const orbX = Math.sin(timeSec * n.pathFreqX + n.pathPhaseX) * n.pathAmpX;

    const orbY = Math.sin(timeSec * (n.pathFreqY * 2.0) + n.pathPhaseY) * n.pathAmpY * 0.6;

    const lissajousX = n.baseX + orbX;

    const lissajousY = n.baseY + orbY;



    // Harmonic liquid offsets

    const harmonicX =

      Math.sin(timeSec * n.hFreq1 + n.hPhase1) * n.hAmp1 +

      Math.cos(timeSec * n.hFreq2 + n.hPhase2) * n.hAmp2 +

      Math.sin(timeSec * n.hFreq3 + n.hPhase3) * n.hAmp3;

    const harmonicY =

      Math.cos(timeSec * n.hFreq1 + n.hPhase1) * n.hAmp1 +

      Math.sin(timeSec * n.hFreq2 + n.hPhase2) * n.hAmp2 +

      Math.cos(timeSec * n.hFreq3 + n.hPhase3) * n.hAmp3;



    // additional slow breathing drift

    const floatX = Math.sin(timeSec * (n.floatSpeed * 1.25) + n.wobble) * (n.baseRadius * 0.06);

    const floatY = Math.cos(timeSec * (n.floatSpeed * 1.05) + n.wobble) * (n.baseRadius * 0.05);



    const offsetX = (mouse.px - cx) * n.parallax * 0.4;

    const offsetY = (mouse.py - cy) * n.parallax * 0.4;



    let targetX = lissajousX + harmonicX + floatX + offsetX;

    let targetY = lissajousY + harmonicY + floatY + offsetY;



    // Fluid ripple + magnetic warp around cursor

    const mdx = targetX - mouse.px;

    const mdy = targetY - mouse.py;

    const dist = Math.hypot(mdx, mdy) || 1;

    const warpRange = n.baseRadius * 0.85;

    const proximity = clamp(1 - dist / warpRange, 0, 1);

    const ripple = Math.sin(timeSec * 8.5 - dist * 0.018 + i * 0.6);

    const speedFactor = clamp(mouse.speed / 900, 0, 2.2);

    const dirX = mdx / dist;

    const dirY = mdy / dist;



    // positive/negative ripple alternates push/pull; speed adds magnetic bend

    const warpForce = proximity * (20 + speedFactor * 36) * ripple;

    const magneticForce = proximity * speedFactor * 28;

    targetX += dirX * warpForce + mouse.vx * magneticForce;

    targetY += dirY * warpForce + mouse.vy * magneticForce;



    // smooth movement

    n.x = lerp(n.x, targetX, 0.07 + n.parallax * 0.05);

    n.y = lerp(n.y, targetY, 0.07 + n.parallax * 0.05);



    // asynchronous pulsing + mouse ripple-driven radius warp

    const pulse = 1 + 0.35 * Math.sin(timeSec * n.pulseSpeed + n.pulsePhase);

    const radiusWarp = proximity * (Math.abs(ripple) * 18 + speedFactor * 24);

    const targetRadius = n.baseRadius * pulse + radiusWarp;

    n.renderRadius = lerp(n.renderRadius, targetRadius, 0.11);



    // draw vibrant neon gradient

    const rad = n.renderRadius;

    const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, rad);

    g.addColorStop(0, hexToRgba(n.color, 0.95));

    g.addColorStop(0.35, hexToRgba(n.color, 0.78));

    g.addColorStop(0.65, hexToRgba(n.color, 0.42));

    g.addColorStop(1, hexToRgba(n.color, 0.0));



    ctx.fillStyle = g;

    ctx.beginPath();

    ctx.arc(n.x, n.y, rad, 0, Math.PI * 2);

    ctx.fill();

  }



  // reset composite for any UI overlays

  ctx.globalCompositeOperation = 'source-over';



  rafId = requestAnimationFrame(animate);

}



/* ---------- UI Toggle & Keyboard Bindings ---------- */

let uiHidden = false;

function setUiHidden(v) {

  uiHidden = !!v;

  if (uiHidden) {

    panel.classList.add('hidden');

    toggleUiBtn.textContent = 'Show UI';

    toggleUiBtn.title = 'Show UI (H / Esc)';

  } else {

    panel.classList.remove('hidden');

    toggleUiBtn.textContent = 'Hide UI';

    toggleUiBtn.title = 'Hide UI (H / Esc)';

  }

}

toggleUiBtn.addEventListener('click', () => setUiHidden(!uiHidden));

window.addEventListener('keydown', (e) => {

  if (e.key === 'h' || e.key === 'H' || e.key === 'Escape') {

    setUiHidden(!uiHidden);

  }

});



/* reset to defaults */

resetBtn.addEventListener('click', () => {

  for (let i=0;i<pickers.length;i++){

    pickers[i].inputEl.value = DEFAULT_COLORS[i] || '#ffffff';

    pickers[i].enableEl.checked = true;

    pickers[i].clearBtn.textContent = 'Disable';

  }

  onColorsChanged();

});



/* ---------- Initialize and start ---------- */

function init() {

  fitFullScreenCanvas();

  createNodes();

  assignColorsToNodes(getActiveColors());

  if (rafId) cancelAnimationFrame(rafId);

  rafId = requestAnimationFrame(animate);

}

init();



/* Recreate nodes when screen size changes significantly */

let resizeTimeout;

window.addEventListener('resize', () => {

  clearTimeout(resizeTimeout);

  resizeTimeout = setTimeout(() => {

    fitFullScreenCanvas();

    createNodes();

    assignColorsToNodes(getActiveColors());

  }, 120);

}, { passive: true });



/* make controls accessible via keyboard focus */

panel.addEventListener('keydown', (e) => {

  if (e.key === 'Escape') { setUiHidden(true); }

});



/* On color change, reassign and repaint */

for (const p of pickers) {

  p.inputEl.addEventListener('input', () => {

    assignColorsToNodes( getActiveColors() );

  });

  p.enableEl.addEventListener('change', () => {

    assignColorsToNodes( getActiveColors() );

  });

}



/* Ensure we have at least 2 active colors when someone disables many */

const observer = new MutationObserver(() => {

  // ensure min count

  const active = getActiveColors();

  if (active.length < MIN_ACTIVE_COLORS) {

    // if somehow we ended up with <2, ensure assignment provides at least two by feeding back

    assignColorsToNodes(active);

  }

});

observer.observe(pickersContainer, { childList: true, subtree: true });



/* Accessibility: clicking panel shouldn't blur pointer events */

panel.addEventListener('pointerdown', (e) => {

  e.stopPropagation();

});



/* Make sure canvas always fills entire window (cover potential scrollbars) */

function fitFullScreenCanvas() {

  canvas.style.width = window.innerWidth + 'px';

  canvas.style.height = window.innerHeight + 'px';

  resizeCanvas();

}

window.addEventListener('resize', fitFullScreenCanvas, { passive: true });



/* expose a small API for debugging (optional) */

window.__meshGradient = {
